server:
  port: 8080

spring:
  application:
    name: todo-backend
  datasource:
    # Default to H2 in-memory DB for instant local setup, but can be switched to MySQL
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: 9a6f8b1c4e7d2a5f8b1c4e7d2a5f8b1c4e7d2a5f8b1c4e7d2a5f8b1c4e7d2a5f
    expiration-ms: 86400000 # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
